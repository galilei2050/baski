[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baski"
version = "0.6.1"
description = "Shared foundation library: primitives, patterns, FastAPI server, GCP integrations, Telegram framework."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Vladimir Baskakov" }]

dependencies = [
    "anthropic",
    "anyio",
    "pyyaml",
    "python-dateutil",
    "pytz",
    "google-cloud-firestore",
    "google-cloud-logging",
    "google-cloud-storage",
    "google-cloud-monitoring",
    "google-cloud-pubsub",
    "google-cloud-bigquery",
    "google-cloud-tasks",
    "google-api-core",
    "google-auth",
    "google-genai",
    "fastapi",
    "starlette",
    "hypercorn",
    "httpx",
    "pydantic",
    "pymongo>=4.9",
    "cryptography",
    "aiogram>=3",
    "marshmallow>=3",
    "playwright",
    "beautifulsoup4",
    "markdownify",
    "pulumi",
    "pulumi-gcp",
    "gitpython",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["baski"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
external = ["ANON001", "ANON002"]  # anon_lint.py custom rules
ignore = [
    # Formatter conflicts
    "COM812",
    # Project conventions
    "RUF013",  # implicit-optional — explicit X | None used instead
    "RUF001",  # ambiguous unicode chars — bilingual (RU + EN) plugins need real Cyrillic
    "SIM110",  # explicit for-loops over any() — easier to extend with logging later
    "D203", "D213",  # docstring style conflicts (we use D211, D212)
    "G",    # logging-format
    "TRY003",
    "EM101", "EM102",
    "TID252",
    "B008",  # FastAPI
]

[tool.ruff.lint.pylint]
max-args = 4
max-positional-args = 4
max-branches = 7
max-statements = 20
max-locals = 10
max-bool-expr = 3
max-nested-blocks = 3
max-returns = 5

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
