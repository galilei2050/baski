[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baski"
version = "0.5.0"
description = "Shared foundation library: primitives, patterns, FastAPI server, GCP integrations, Telegram framework."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Vladimir Baskakov" }]

dependencies = [
    "pyyaml",
    "python-dateutil",
    "pytz",
    "google-cloud-firestore",
    "google-cloud-logging",
    "google-cloud-storage",
    "google-cloud-monitoring",
    "google-cloud-pubsub",
    "google-cloud-bigquery",
    "google-cloud-tasks",
    "google-api-core",
    "google-auth",
    "google-genai",
    "fastapi",
    "starlette",
    "hypercorn",
    "httpx",
    "pydantic",
    "pymongo>=4.9",
    "cryptography",
    "aiogram>=3",
    "marshmallow>=3",
    "playwright",
    "beautifulsoup4",
    "markdownify",
    "pulumi",
    "pulumi-gcp",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["baski"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts
    "COM812", "ISC001",
    # Project conventions
    "RUF013",  # implicit-optional — we use explicit X | None
    "D203", "D213",  # docstring style conflicts (we use D211, D212)
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # missing docstrings — not enforced
    "B008",    # function calls in defaults — fastapi Depends() pattern
    "FAST002", # Annotated[T, Depends()] — project prefers the simpler `param: T = Depends(...)` form
    "FBT",     # boolean trap — not enforced
    "G",       # logging-format — we use structured logging
    "TRY003",  # long exception messages
    "EM101", "EM102",  # exception strings — not enforced
    "ANN401",  # **kwargs: Any — required for httpx/fastapi forwarding
    "TID252",  # relative imports — project prefers `from ..pkg import x` for intra-package
]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8
max-branches = 8
max-statements = 45
max-locals = 10
max-bool-expr = 3
max-nested-blocks = 3

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"
